<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop panel preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 320px; height: 640px; box-sizing: border-box; padding: 10px; border-radius: 40px; background: #1B1F27; font-family: 'Plus Jakarta Sans', system-ui, sans-serif" role="img" aria-label="Phone preview of the Shop panel under the live player">
  <div style="width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: {{bg}}; display: flex; flex-direction: column">
    <div style="height: 168px; background: #2A2F3A; position: relative; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box">
      <span style="position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 4px; background: #C8205E; color: #FFFFFF; font-size: 11px; font-weight: 700">LIVE</span>
      <span style="color: #FFFFFF; font-size: 13px; font-weight: 600">Seputar iNews</span>
    </div>
    <div style="padding: 14px 14px 8px; display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 16px; font-weight: 700; color: {{title}}">Shop</span>
      <span style="font-size: 11px; color: {{muted}}">From Shopee</span>
    </div>
    <div style="padding: 0 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
        <div style="border-radius: 10px; overflow: hidden; background: {{card}}; display: flex; flex-direction: column">
          <div style="height: 92px; background: {{img}}"></div>
          <div style="padding: 8px; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 11px; font-weight: 600; line-height: 1.3; color: {{title}}">{{item.name}}</span>
            <span style="font-size: 12px; font-weight: 700; color: {{price}}">Rp [price]</span>
            <sc-if value="{{buy}}" hint-placeholder-val="{{ true }}">
              <span style="margin-top: 2px; height: 26px; border-radius: 6px; background: #EE4D2D; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">Buy</span>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["night","day"],"default":"night"},"products":{"editor":"int","min":1,"max":4,"default":4},"buy":{"editor":"boolean","default":true},"$preview":{"width":320,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const night = (this.props.theme ?? 'night') === 'night';
    const names = ['Naturabite Pure Matcha Powder', 'Permen Matcha Coffee Bebas Gula', 'Dorskin Matcha Glow Dream Mask', 'Hanasui Lip Cream Series Boba'];
    const n = Math.max(1, Math.min(4, Number(this.props.products ?? 4)));
    return {
      items: names.slice(0, n).map(function (name) { return { name: name }; }),
      buy: this.props.buy ?? true,
      bg: night ? '#0F1B33' : '#FFFFFF',
      card: night ? '#18264A' : '#F3F5F8',
      img: night ? '#2B3D63' : '#DDE2EA',
      title: night ? '#FFFFFF' : '#111A2E',
      muted: night ? '#AEBBD3' : '#4A5568',
      price: night ? '#FF8A6B' : '#C2361B'
    };
  }
}
</script>
</body>
</html>
